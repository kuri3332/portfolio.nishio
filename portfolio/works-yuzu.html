<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;500;600;700;800&family=Aboreto&family=Antic+Didone&display=swap" rel="stylesheet">

<!-- CSS -->

    <link rel="stylesheet" href="css/style.css">

    <title>Works 07 | SLOW DESIGN PORTFOLIO</title>

<body>
    <div class="background"></div>
    <!-- ヘッダー -->
    <header class="header">

    <!-- ロゴ -->
        <a href="#" class="header-logo">
            <span class="header-logo-main">SLOW DESIGN</span>
            <span class="header-logo-sub">PORTFOLIO</span>
        </a>
    
    <!-- メニュー -->    
        <a class="menu-button" href="menu.html" aria-label="メニューを開く">
            <span>ME</span>
            <span>NU</span>
        </a>
    </header>

    <main class="detail-main">
        <section class="detail-hero">
            <div class="detail-hero-image">
                <img src="images/mokup-07.png" alt="Sauna resort「 YUZU 」">
            </div>
                
            <h1 class="detail-title">Sauna resort「 YUZU 」</h1>
        </section>

        <section class="detail-info">
            <dl>
                <div class="detail-info-row">
                    <dt>カテゴリー</dt>
                    <dd>カード・ロゴ・リーフレット</dd>
                </div>

                <div class="detail-info-row">
                    <dt>制作範囲</dt>
                    <dd>デザイン</dd>
                </div>

                <div class="detail-info-row">
                    <dt>作品概要</dt>
                    <dd>
                        Sauna resort YUZUをオープンし、他の施設にカードやリーフレットを置いてもらうことで施設の概要がわかるようにすること。集客を目的とし作成。
                    </dd>
                </div>

                <div class="detail-info-row">
                    <dt>ツール</dt>
                    <dd>Illustrator</dd>
                </div>
            </dl>
        </section>

        <section class="yuzu-gallery">
            <div class="yuzu-gallery-block">
                <h2 class="yuzu-gallery-title en-text">Card / Logo</h2>
                <div class="yuzu-card-grid">
                    <img src="images/yuzu-card1.png" 
                        alt="Sauna resort YUZUのロゴカード">
                    <img src="images/yuzu-card2.png" 
                         alt="Sauna resort YUZUのショップカード">
                </div>
            </div>

            <div class="yuzu-leaflet">
                <h2 class="yuzu-gallery-title">リーフレット</h2>
                <img class="yuzu-leaflet-image-top"
                    src="images/yuzu-pf.png" 
                        alt="YUZUのリーフレット表紙">
                <img class="yuzu-leaflet-image-bottom"
                    src="images/yuzu-pf2.png" 
                         alt="YUZUのリーフレット裏">
            </div>
        </section>

    </main>
<!-- footer -->
    <footer class="detail-footer">
        <nav class="detail-footer-nav" aria-label="ページ移動">
            <a class="detail-allworks" href="all-works.html">
                <span class="detail-allworks-icon" aria-hidden="true">
                    <span class="arrow-allworks-icon"></span>

            </a>

            <a class="detail-home" href="index.html">
                <span>Home</span>
                <span class="detail-allworks-icon detail-home-icon" aria-hidden="true">
